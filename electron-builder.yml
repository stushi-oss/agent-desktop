# appId 必须与 src/main/notifications.ts 的 app.setAppUserModelId('com.agentdesk.app') 保持一致，
# 否则 Windows 上通知 (Toast) 与安装包身份对不上，通知会丢失激活事件。
appId: com.agentdesk.app
productName: AgentDesk
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: true
  artifactName: AgentDesk-Setup-${version}.${ext}
